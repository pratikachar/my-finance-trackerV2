function processRecurring(s){
  const now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  let newEntries=[];
  let newRecurring=[];
  let maxId=s.nextId;
  for(const r of (s.recurring||[])){
    if(!r.active) {newRecurring.push(r);continue;}
    const nextDate=new Date(r.nextDate||r.startDate);
    let shouldGen=false;
    if(r.freq==="daily"&&todayStr>=r.nextDate) shouldGen=true;
    else if(r.freq==="weekly"){
      const diffW=Math.floor((now-nextDate)/(7*86400000));
      if(diffW>=0) shouldGen=true;
    } else if(r.freq==="monthly"){
      const nextM=nextDate.getFullYear()*12+nextDate.getMonth();
      const curM=now.getFullYear()*12+now.getMonth();
      if(curM>=nextM) shouldGen=true;
    }
    if(shouldGen){
      const entry={...r.template,id:maxId++,date:todayStr};
      newEntries.push(entry);
      const newNext=new Date(nextDate);
      if(r.freq==="daily") newNext.setDate(newNext.getDate()+1);
      else if(r.freq==="weekly") newNext.setDate(newNext.getDate()+7);
      else if(r.freq==="monthly") newNext.setMonth(newNext.getMonth()+1);
      newRecurring.push({...r,nextDate:newNext.toISOString().slice(0,10)});
    } else {
      newRecurring.push(r);
    }
  }
  if(newEntries.length>0){
    return {...s,entries:[...s.entries,...newEntries],nextId:maxId,recurring:newRecurring};
  }
  return s;
}

// Grouped vertical bar chart for income vs expenses
const BarChartSVG = ({data, height=200}) => {
  const W=560, H=height, PL=48, PR=8, PT=10, PB=24;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allVals=data.flatMap(d=>[d.inc||0,d.exp||0]);
  const maxV=Math.max(...allVals,1);
  const groupW=cW/data.length;
  const bW=Math.min(groupW*0.35,22);
  const fmt=v=>v>=1000?(v/1000).toFixed(0)+"K":v;
  const ticks=4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:height,display:"block"}}>
      {/* Y gridlines */}
      {Array.from({length:ticks+1},(_,i)=>{
        const y=PT+cH*(1-i/ticks);
        return <g key={i}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="var(--card-border)" strokeWidth="1"/>
          <text x={PL-4} y={y+4} fontSize="9" fill="var(--text-mut)" textAnchor="end">{fmt(maxV*i/ticks)}</text>
        </g>;
      })}
      {/* Bars */}
      {data.map((d,i)=>{
        const cx=PL+groupW*(i+0.5);
        const incH=(d.inc/maxV)*cH;
        const expH=(d.exp/maxV)*cH;
        return <g key={i}>
          <rect x={cx-bW-1} y={PT+cH-incH} width={bW} height={Math.max(incH,1)} fill="#10B981" rx="3"/>
          <rect x={cx+1}    y={PT+cH-expH} width={bW} height={Math.max(expH,1)} fill="#EF4444" rx="3"/>
          <text x={cx} y={H-4} fontSize="10" fill="var(--text-mut)" textAnchor="middle">{d.month}</text>
        </g>;
      })}
    </svg>
  );
};

// Horizontal bar chart for category spending
const HBarChartSVG = ({data}) => {
  if(!data||data.length===0) return null;
  const rowH=36, PL=72, PR=60, PT=4;
  const H=data.length*rowH+PT*2;
  const W=400;
  const maxV=Math.max(...data.map(d=>d.value),1);
  const fmt=v=>v>=1000?(v/1000).toFixed(1)+"K":v;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,display:"block"}}>
      {data.map((d,i)=>{
        const y=PT+i*rowH;
        const bW=Math.max(((d.value/maxV)*(W-PL-PR)),2);

          <rect x={PL} y={y+6} width={bW} height={rowH-14} fill={color} rx="4"/>

        </g>;

};

// Line chart for savings trend
const LineChartSVG = ({data, height=150}) => {
  const W=560, H=height, PL=44, PR=8, PT=10, PB=22;
  const cW=W-PL-PR, cH=H-PT-PB;
  const vals=data.map(d=>d.savings);
  const minV=Math.min(...vals,0);
  const maxV=Math.max(...vals,1);
  const range=maxV-minV||1;
  const fmt=v=>v>=1000?(v/1000).toFixed(0)+"K":v<0?"-"+((-v/1000).toFixed(0))+"K":v;
  const px=(i)=>PL+cW*(i/(data.length-1||1));
  const py=(v)=>PT+cH*(1-(v-minV)/range);
  const pts=data.map((d,i)=>`${px(i)},${py(d.savings)}`).join(" ");
  const apts=`${PL},${PT+cH} ${data.map((d,i)=>`${px(i)},${py(d.savings)}`).join(" ")} ${PL+cW},${PT+cH}`;
  const ticks=3;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:height,display:"block"}}>
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#8B5CF6" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#8B5CF6" stopOpacity="0.01"/>
        </linearGradient>
      </defs>
      {Array.from({length:ticks+1},(_,i)=>{
        const v=minV+range*(i/ticks);
        const y=PT+cH*(1-i/ticks);
        return <g key={i}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="var(--card-border)" strokeWidth="1"/>
          <text x={PL-4} y={y+4} fontSize="9" fill="var(--text-mut)" textAnchor="end">{fmt(v)}</text>
        </g>;
      })}
      {data.length>1 && <polygon points={apts} fill="url(#lineGrad)"/>}
      {data.length>1 && <polyline points={pts} fill="none" stroke="#8B5CF6" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {data.map((d,i)=>(
        <g key={i}>
          <circle cx={px(i)} cy={py(d.savings)} r="4" fill="#8B5CF6"/>
          <text x={px(i)} y={H-4} fontSize="10" fill="var(--text-mut)" textAnchor="middle">{d.month}</text>
        </g>
      ))}
    </svg>
  );
};

// Donut / Pie chart for category breakdown
const DonutChartSVG = ({data, size=160}) => {
  const cx=size/2, cy=size/2, R=size*0.44, r=size*0.25;
  const total=data.reduce((a,d)=>a+d.value,0)||1;
  let angle=-Math.PI/2;
  const slices=[];
  if(data.length===1){
    // Full donut: outer circle in two halves, inner circle in two halves (counter-clockwise)
    const c=CC[data[0].name]||"#9CA3AF";
    const path=`M${cx} ${cy-R} A${R} ${R} 0 1 1 ${cx} ${cy+R} A${R} ${R} 0 1 1 ${cx} ${cy-R} M${cx} ${cy-r} A${r} ${r} 0 1 0 ${cx} ${cy+r} A${r} ${r} 0 1 0 ${cx} ${cy-r}`;
    slices.push({path,color:c});
  }else{
    data.forEach(d=>{
      const sweep=(d.value/total)*2*Math.PI;
      const x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
      angle+=sweep;
      const x2=cx+R*Math.cos(angle), y2=cy+R*Math.sin(angle);
      const ix1=cx+r*Math.cos(angle-sweep), iy1=cy+r*Math.sin(angle-sweep);
      const ix2=cx+r*Math.cos(angle), iy2=cy+r*Math.sin(angle);
      const large=sweep>Math.PI?1:0;
      slices.push({path:`M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${ix2} ${iy2} A${r} ${r} 0 ${large} 0 ${ix1} ${iy1} Z`,color:CC[d.name]||"#9CA3AF"});
    });
  }
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="var(--card-bg)" strokeWidth="1.5" fillRule="evenodd"/>)}
    </svg>
  );
};

  // Q1: Auto-detect EMI/SIP payment from a logged expense → stops the reminder
  function checkAutoPayment(amount, dateStr){
    const d=new Date(dateStr);
    let loanChanged=false, nwChanged=false;
    const newLoans = loans.map(l=>{
      if(!l.nextDate||l.completed) return l;
      const diff=Math.ceil((new Date(l.nextDate)-d)/86400000);
      const emi=l.emi>0?l.emi:calcEMI(l.total,l.rate,l.tenure);
      if(emi>0 && Math.abs(amount-emi)/emi<0.02 && diff>=-3 && diff<=7){
        loanChanged=true;
        const nd=new Date(l.nextDate); nd.setMonth(nd.getMonth()+1);
        return {...l, paid:(l.paid||0)+emi, nextDate:nd.toISOString().slice(0,10)};
      }
      return l;
    });
    const newNw = netWorthItems.map(i=>{
      if(i.type!=="asset"||!i.monthly||!i.startDate||i.closed) return i;
      const day=new Date(i.startDate).getDate();
      let due=new Date(d.getFullYear(),d.getMonth(),day);
      if(due<d) due=new Date(d.getFullYear(),d.getMonth()+1,day);
      const diff=Math.ceil((due-d)/86400000);
      if(Math.abs(amount-i.monthly)/i.monthly<0.02 && diff>=-3 && diff<=3){
        nwChanged=true;
        return {...i, lastPaid:dateStr};
      }
      return i;
    });
    if(loanChanged){saveLoans(newLoans);showToast("✅ EMI payment recorded — reminder cleared");}
    if(nwChanged){saveNetWorth(newNw);showToast("✅ SIP contribution recorded — reminder cleared");}
  }

async function dl(content, name, type) {
  const file = new File([content], name, { type }); 
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name, text: "Finance Tracker Export" });
      showToast(`\u2705 ${name} shared successfully`);
      return;
    } catch (err) { if (err.name === 'AbortError') return; }
  }
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  showToast(isMobile ? `\u2705 ${name} saved \u2014 check your Downloads folder` : `\u2705 ${name} downloaded`);
}

  const renderLoans = () => {
    function resetLoanForm(){setLoanForm({name:"",total:0,rate:0,tenure:0,emi:0,paid:0,nextDate:"",completed:false});setEditLoanId(null);}
    function addLoan(){
      if(!loanForm.name||loanForm.total<=0) return;
      const emi = loanForm.emi>0?loanForm.emi:Math.round(calcEMI(loanForm.total,loanForm.rate,loanForm.tenure));
      const newLoan = {...loanForm,emi,id:editLoanId||Date.now()};
      if(editLoanId) saveLoans(loans.map(l=>l.id===editLoanId?newLoan:l));
      else saveLoans([...loans,newLoan]);
      resetLoanForm();setShowLoanForm(false);
      showToast(editLoanId?"Loan updated":"Loan added");
    }
    function delLoan(id){setConf({msg:"Delete this loan record?",onConfirm:()=>{saveLoans(loans.filter(l=>l.id!==id));setConf(null);}});}
    function toggleLoanCompleted(id){saveLoans(loans.map(l=>l.id===id?{...l,completed:!l.completed}:l));}
    function openEditLoan(l){setLoanForm({name:l.name,total:l.total,rate:l.rate,tenure:l.tenure,emi:l.emi,paid:l.paid,nextDate:l.nextDate||"",completed:l.completed||false});setEditLoanId(l.id);setShowLoanForm(true);}
    // Check for upcoming EMI dates
    const emiReminders = reminders.filter(r=>r.type==="EMI");
    return (
      <div>
        {emiReminders.length>0&&<Card style={{marginBottom:12,background:"#FFFBEB",border:"1px solid #F59E0B"}}>
          <p style={{margin:0,fontSize:12,fontWeight:600,color:"#D97706"}}>🔔 EMI Due Soon</p>
          {emiReminders.map((r,i)=><p key={i} style={{margin:"4px 0 0",fontSize:11,color:"var(--text-sec)"}}>{r.name}: {INR(r.amt)} {r.days===0?"today":`in ${r.days}d`} ({r.date.toISOString().slice(0,10)})</p>)}
        </Card>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <p style={{margin:0,fontSize:12,fontWeight:600,color:"var(--text-sec)",textTransform:"uppercase",letterSpacing:"0.07em"}}>Loans & Debts ({loans.length})</p>
          <button onClick={()=>{resetLoanForm();setShowLoanForm(true);}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"6px 14px",borderRadius:99,background:"#F97316",color:"#fff",border:"none",cursor:"pointer",fontWeight:600}}><Ico n="plus" s={13} c="#fff"/> Add</button>
        </div>
        {showLoanForm&&<Card style={{marginBottom:12}}>
          <p style={{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"var(--text)"}}>{editLoanId?"Edit Loan":"Add Loan"}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <input value={loanForm.name} onChange={e=>setLoanForm(f=>({...f,name:e.target.value}))} placeholder="Loan name (e.g. Home Loan)" style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[{k:"total",l:"Total (₹)"},{k:"rate",l:"Rate (%)"},{k:"tenure",l:"Tenure (mo)"}].map(f=><div key={f.k}><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>{f.l}</label><input type="number" value={loanForm[f.k]} onChange={e=>{const v={...loanForm,[f.k]:Number(e.target.value)};if(f.k==="rate"||f.k==="total"||f.k==="tenure"){const e2=v.rate>0&&v.tenure>0&&v.total>0?calcEMI(v.total,v.rate,v.tenure):v.emi;setLoanForm({...v,emi:e2});}else setLoanForm(v);}} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>)}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>EMI (₹) — auto-calc</label><input type="number" value={loanForm.emi} onChange={e=>setLoanForm(p=>({...p,emi:Number(e.target.value)}))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
              <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>Amount Paid (₹)</label><input type="number" value={loanForm.paid} onChange={e=>setLoanForm(p=>({...p,paid:Number(e.target.value)}))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
            </div>
            <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>Next EMI Date (for reminders)</label><input type="date" value={loanForm.nextDate} onChange={e=>setLoanForm(p=>({...p,nextDate:e.target.value}))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
            {loanForm.rate>0&&loanForm.total>0&&loanForm.tenure>0&&<div style={{background:"#FFF7ED",borderRadius:8,padding:"8px",fontSize:11,color:"#D97706"}}>💡 Calculated EMI: <strong>{INR(calcEMI(loanForm.total,loanForm.rate,loanForm.tenure))}</strong>/mo for {loanForm.tenure} months</div>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowLoanForm(false);resetLoanForm();}} style={{flex:1,padding:"8px",borderRadius:8,border:"1.5px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",cursor:"pointer",fontSize:12,fontWeight:600}}>Cancel</button>
              <button onClick={addLoan} style={{flex:2,padding:"8px",borderRadius:8,border:"none",background:"#F97316",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600}}>{editLoanId?"Update":"Add"} Loan</button>
            </div>
          </div>
        </Card>}
        {(()=>{
          const activeLoans = loans.filter(l=>!l.completed);
          const completedLoans = loans.filter(l=>l.completed);
          if(loans.length===0) return <Card><div style={{textAlign:"center",padding:"2rem"}}><Ico n="debt" s={30} c="var(--text-mut)"/><p style={{margin:"8px 0 0",fontSize:13,color:"var(--text-sec)"}}>No loans tracked. Add your first loan or debt above.</p></div></Card>;
          return <div>
            {activeLoans.map(l=>{
              const pct=l.total>0?Math.min(100,Math.round((l.paid/l.total)*100)):0;
              const rem=l.total-l.paid;
              const calcEmi = l.emi>0?l.emi:calcEMI(l.total,l.rate,l.tenure);
              const dueSoon = l.nextDate?(()=>{const d=new Date(l.nextDate);const diff=Math.ceil((d-new Date())/(86400000));return diff>=0&&diff<=7;})():false;
              return <Card key={l.id} style={{marginBottom:8,border:dueSoon?"1.5px solid #F59E0B":undefined}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <p style={{margin:0,fontSize:14,fontWeight:700,color:"var(--text)"}}>{l.name}{dueSoon&&<span style={{marginLeft:6,fontSize:9,background:"#FEF3C7",color:"#D97706",padding:"2px 6px",borderRadius:99}}>Due</span>}</p>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>openEditLoan(l)} style={{width:26,height:26,borderRadius:6,border:"1px solid var(--card-border)",background:"var(--card-bg)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="edit" s={11} c="var(--text-sec)"/></button>
                    <button onClick={()=>toggleLoanCompleted(l.id)} title="Mark completed" style={{width:26,height:26,borderRadius:6,background:"#D1FAE5",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="check" s={11} c="#059669"/></button>
                    <button onClick={()=>delLoan(l.id)} style={{width:26,height:26,borderRadius:6,background:"#FEE2E2",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="x" s={11} c="#EF4444"/></button>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginBottom:6}}>
                  {[{l:"Total",v:INR(l.total)},{l:"Rate",v:l.rate+"%"},{l:"EMI",v:INR(calcEmi)},{l:"Left",v:INR(rem)}].map(d=><div key={d.l}><p style={{margin:0,fontSize:9,color:"var(--text-mut)",textTransform:"uppercase"}}>{d.l}</p><p style={{margin:0,fontSize:12,fontWeight:600,color:"var(--text)"}}>{d.v}</p></div>)}
                </div>
                <PBar pct={pct} color={pct>=50?"#10B981":"#F97316"} h={6}/>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
                  <span style={{fontSize:10,color:"var(--text-sec)"}}>{pct}% paid · {INR(l.paid)} of {INR(l.total)}</span>
                  {l.nextDate&&<span style={{fontSize:10,color:"var(--text-mut)"}}>📅 {l.nextDate}</span>}
                </div>
              </Card>;
            })}
            {completedLoans.length>0&&<>
              <p style={{fontSize:10,fontWeight:600,color:"var(--text-mut)",margin:"12px 0 4px",textTransform:"uppercase"}}>✅ Completed ({completedLoans.length})</p>
              {completedLoans.map(l=><Card key={l.id} style={{marginBottom:8,opacity:0.55}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <p style={{margin:0,fontSize:13,fontWeight:600,color:"var(--text-sec)",textDecoration:"line-through"}}>{l.name}</p>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>toggleLoanCompleted(l.id)} title="Reopen" style={{width:26,height:26,borderRadius:6,background:"#FEF3C7",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="reset" s={11} c="#D97706"/></button>
                    <button onClick={()=>delLoan(l.id)} style={{width:26,height:26,borderRadius:6,background:"#FEE2E2",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="x" s={11} c="#EF4444"/></button>
                  </div>
                </div>
                <div style={{display:"flex",gap:12,fontSize:11,color:"var(--text-sec)"}}>
                  <span>Total: {INR(l.total)}</span>
                  <span>Paid: {INR(l.paid)}</span>
                </div>
              </Card>)}
            </>}
          </div>;
        })()}
      </div>
    );
  };

  // ── NET WORTH TRACKER (dropdown types, SIP recurring, reminders) ────────
  const renderNetWorth = () => {
    const NW_ASSET_OPTS = ["Savings A/C","PPF","EPF","Stocks","Fixed Deposit","SGB / Gold","NPS","Real Estate","Vehicle","Emergency Fund"];
    const NW_LIAB_OPTS = ["Credit Card","Personal Loan","Home Loan","Vehicle Loan","Education Loan"];
    const NW_SIP_OPTS = ["Mutual Fund (SIP)","PPF","ELSS","NPS","SGB","Index Fund","Other"];
    function calcSIPValue(v,monthly,rate,start){
      if(!start) return v;
      const months = Math.max(0, Math.floor((new Date()-new Date(start))/(86400000*30.4)));
      const r=rate/12/100;
      const fv=v;
      const fvC = monthly>0 ? (r===0? monthly*months : monthly*((Math.pow(1+r,months)-1)/r)) : 0;
      return fv+fvC;
    }
    function addNwItem(){
      const nm = nwForm.custom ? nwForm.name.trim() : nwForm.name;
      if(!nm||nwForm.value<=0) return;
      const item = {...nwForm,name:nm,id:editNwId||Date.now()};
      if(editNwId) saveNetWorth(netWorthItems.map(i=>i.id===editNwId?item:i));
      else saveNetWorth([...netWorthItems,item]);
      setNwForm({name:"",value:0,type:"asset",custom:false});setEditNwId(null);setShowNwForm(false);
      showToast((nwForm.type==="asset"?"Asset":"Liability")+(editNwId?" updated":" added"));
    }
    function addSipItem(){
      const nm = sipForm.custom ? sipForm.name.trim() : sipForm.name;
      if(!nm||sipForm.monthly<=0) return;
      const existing = editNwId && netWorthItems.find(i=>i.id===editNwId);
      const item = {...sipForm,name:nm,type:"asset",closed:existing?existing.closed||false:false,id:editNwId||Date.now()};
      if(editNwId) saveNetWorth(netWorthItems.map(i=>i.id===editNwId?item:i));
      else saveNetWorth([...netWorthItems,item]);
      setSipForm({name:"",monthly:0,rate:7,startDate:today.toISOString().slice(0,10),value:0,custom:false});setEditNwId(null);setShowSipForm(false);
      showToast("SIP"+(editNwId?" updated":" added"));
    }
    function delNwItem(id){setConf({msg:"Delete this item?",onConfirm:()=>{saveNetWorth(netWorthItems.filter(i=>i.id!==id));setConf(null);}});}
    function toggleSipClosed(id){saveNetWorth(netWorthItems.map(i=>i.id===id?{...i,closed:!i.closed}:i));}
    function openEditNw(i){
      if(i.monthly>0){
        setSipForm({name:i.name,monthly:i.monthly||0,rate:i.rate||7,startDate:i.startDate||today.toISOString().slice(0,10),value:i.value||0,custom:!NW_SIP_OPTS.includes(i.name)});
        setEditNwId(i.id);setShowSipForm(true);
      } else {
        const eOpts = i.type==="asset"?NW_ASSET_OPTS:NW_LIAB_OPTS;
        setNwForm({name:i.name,value:i.value,type:i.type,custom:!eOpts.includes(i.name)});
        setEditNwId(i.id);setShowNwForm(true);
      }
    }
    const nwOpts = nwForm.type==="asset"?NW_ASSET_OPTS:NW_LIAB_OPTS;
    const sipOpts = NW_SIP_OPTS;
    const assets = netWorthItems.filter(i=>i.type==="asset"&&!(i.monthly>0));
    const sipItems = netWorthItems.filter(i=>i.type==="asset"&&i.monthly>0);
    const activeSips = sipItems.filter(i=>!i.closed);
    const closedSips = sipItems.filter(i=>i.closed);
    const liabilities = netWorthItems.filter(i=>i.type==="liability");
    const totalAssets = assets.reduce((a,i)=>a+i.value,0) + activeSips.reduce((a,i)=>a+calcSIPValue(i.value,i.monthly||0,i.rate||0,i.startDate),0) + closedSips.reduce((a,i)=>a+i.value,0);
    const totalLiab = liabilities.reduce((a,i)=>a+i.value,0);
    const nwTotal = totalAssets-totalLiab;
    const sipReminders = reminders.filter(r=>r.type==="SIP");
    const nwSelVal = !nwForm.name?"":(nwForm.custom?"__custom":(nwOpts.includes(nwForm.name)?nwForm.name:"__custom"));
    const sipSelVal = !sipForm.name?"":(sipForm.custom?"__custom":(sipOpts.includes(sipForm.name)?sipForm.name:"__custom"));
    return (
      <div>
        {sipReminders.length>0&&<Card style={{marginBottom:12,background:"#EFF6FF",border:"1px solid #3B82F6"}}>
          <p style={{margin:0,fontSize:12,fontWeight:600,color:"#1D4ED8"}}>🔔 SIP / Contribution Due</p>
          {sipReminders.map((r,i)=><p key={i} style={{margin:"4px 0 0",fontSize:11,color:"var(--text-sec)"}}>{r.name}: {INR(r.amt)} {r.days===0?"today":`in ${r.days}d`} ({r.date.toISOString().slice(0,10)})</p>)}
        </Card>}
        <Card style={{marginBottom:12,background:"linear-gradient(135deg,#D1FAE5,var(--card-bg))"}}>
          <p style={{margin:"0 0 4px",fontSize:11,color:"var(--text-sec)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Net Worth</p>
          <p style={{margin:0,fontSize:28,fontWeight:800,color:nwTotal>=0?"#059669":"#DC2626"}}>{sINR(nwTotal)}</p>
          <div style={{display:"flex",gap:16,marginTop:6}}>
            <span style={{fontSize:12,color:"#059669",fontWeight:600}}>Assets: {INR(totalAssets)}</span>
            <span style={{fontSize:12,color:"#DC2626",fontWeight:600}}>Liabilities: {INR(totalLiab)}</span>
          </div>
        </Card>
        {/* Assets & Liabilities (one-time) */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <p style={{margin:0,fontSize:12,fontWeight:600,color:"var(--text-sec)",textTransform:"uppercase",letterSpacing:"0.07em"}}>Assets & Liabilities</p>
          <button onClick={()=>{setNwForm({name:"",value:0,type:"asset",custom:false});setEditNwId(null);setShowNwForm(true);}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"6px 14px",borderRadius:99,background:"#22C55E",color:"#fff",border:"none",cursor:"pointer",fontWeight:600}}><Ico n="plus" s={13} c="#fff"/> Add</button>
        </div>
        {showNwForm&&<Card style={{marginBottom:12}}>
          <p style={{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"var(--text)"}}>{editNwId?"Edit Item":"Add Item"}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <select value={nwSelVal} onChange={e=>{const v=e.target.value;if(v==="__custom"){setNwForm(f=>({...f,custom:true,name:""}))}else{setNwForm(f=>({...f,custom:false,name:v}))}}} style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}>
              <option value="">Select {nwForm.type} type…</option>
              {nwOpts.map(o=><option key={o}>{o}</option>)}
              <option value="__custom">+ Other (custom name)</option>
            </select>
            {nwForm.custom&&<input value={nwForm.name} onChange={e=>setNwForm(f=>({...f,name:e.target.value}))} placeholder={"Custom "+(nwForm.type==="asset"?"asset":"liability")+" name"} style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>}
            <div style={{display:"flex",gap:8}}>
              {["asset","liability"].map(t=><button key={t} onClick={()=>setNwForm(f=>({...f,type:t,custom:false,name:""}))} style={{flex:1,padding:"7px",borderRadius:8,border:"1.5px solid",fontSize:12,fontWeight:600,cursor:"pointer",textTransform:"capitalize",borderColor:nwForm.type===t?(t==="asset"?"#22C55E":"#EF4444"):"var(--card-border)",background:nwForm.type===t?(t==="asset"?"#F0FDF4":"#FEF2F2"):"var(--card-bg)",color:nwForm.type===t?"var(--text)":"var(--text-sec)"}}>{t}</button>)}
            </div>
            <input type="number" value={nwForm.value||""} onChange={e=>setNwForm(f=>({...f,value:Number(e.target.value)}))} placeholder="Current Value (₹)" style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowNwForm(false);setEditNwId(null);setNwForm({name:"",value:0,type:"asset",custom:false});}} style={{flex:1,padding:"8px",borderRadius:8,border:"1.5px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",cursor:"pointer",fontSize:12,fontWeight:600}}>Cancel</button>
              <button onClick={addNwItem} style={{flex:2,padding:"8px",borderRadius:8,border:"none",background:"#22C55E",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600}}>{editNwId?"Update":"Add"} {nwForm.type==="asset"?"Asset":"Liability"}</button>
            </div>
          </div>
        </Card>}
        {/* SIP / Recurring Investments */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,marginTop:16}}>
          <p style={{margin:0,fontSize:12,fontWeight:600,color:"var(--text-sec)",textTransform:"uppercase",letterSpacing:"0.07em"}}>SIP / Recurring Investments</p>
          <button onClick={()=>{setSipForm({name:"",monthly:0,rate:7,startDate:today.toISOString().slice(0,10),value:0,custom:false});setEditNwId(null);setShowSipForm(true);}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"6px 14px",borderRadius:99,background:"#3B82F6",color:"#fff",border:"none",cursor:"pointer",fontWeight:600}}><Ico n="plus" s={13} c="#fff"/> Add SIP</button>
        </div>
        {showSipForm&&<Card style={{marginBottom:12}}>
          <p style={{margin:"0 0 8px",fontSize:13,fontWeight:700,color:"var(--text)"}}>{editNwId?"Edit SIP":"Add SIP"}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <select value={sipSelVal} onChange={e=>{const v=e.target.value;if(v==="__custom"){setSipForm(f=>({...f,custom:true,name:""}))}else{setSipForm(f=>({...f,custom:false,name:v}))}}} style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}>
              <option value="">Select SIP type…</option>
              {sipOpts.map(o=><option key={o}>{o}</option>)}
              <option value="__custom">+ Other (custom name)</option>
            </select>
            {sipForm.custom&&<input value={sipForm.name} onChange={e=>setSipForm(f=>({...f,name:e.target.value}))} placeholder="Custom SIP name" style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>}
            <input type="number" value={sipForm.monthly||""} onChange={e=>setSipForm(f=>({...f,monthly:Number(e.target.value)}))} placeholder="Monthly Contribution (₹)" style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <input type="number" value={sipForm.rate||""} onChange={e=>setSipForm(f=>({...f,rate:Number(e.target.value)}))} placeholder="Exp. return %" style={{padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
              <input type="number" value={sipForm.value||""} onChange={e=>setSipForm(f=>({...f,value:Number(e.target.value)}))} placeholder="Current value (₹)" style={{padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
            </div>
            <input type="date" value={sipForm.startDate} onChange={e=>setSipForm(f=>({...f,startDate:e.target.value}))} style={{padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowSipForm(false);setEditNwId(null);setSipForm({name:"",monthly:0,rate:7,startDate:today.toISOString().slice(0,10),value:0,custom:false});}} style={{flex:1,padding:"8px",borderRadius:8,border:"1.5px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",cursor:"pointer",fontSize:12,fontWeight:600}}>Cancel</button>
              <button onClick={addSipItem} style={{flex:2,padding:"8px",borderRadius:8,border:"none",background:"#3B82F6",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600}}>{editNwId?"Update":"Add"} SIP</button>
            </div>
          </div>
        </Card>}
        {netWorthItems.length===0?(
          <Card><div style={{textAlign:"center",padding:"2rem",color:"var(--text-mut)"}}><p style={{margin:0,fontSize:13}}>Add assets, liabilities, and SIPs to track net worth.</p></div></Card>
        ):<div style={{display:"flex",flexDirection:"column",gap:8}}>

  // ── TAX CALCULATOR (India) ───────────────────────────────────────────────
  const renderTaxCalc = () => {
    const annualIncome = entries.filter(e=>e.type==="income").reduce((a,b)=>a+b.amount,0);
    const taxableIncome = Math.max(0, annualIncome - (taxRegime==="old"?Math.min(ded80C,150000)+ded80D+otherDed:0));
    function calcTaxNew(inc){
      if(inc<=300000) return 0;
      if(inc<=600000) return (inc-300000)*0.05;
      if(inc<=900000) return 15000+(inc-600000)*0.1;
      if(inc<=1200000) return 45000+(inc-900000)*0.15;
      if(inc<=1500000) return 90000+(inc-1200000)*0.2;
      return 150000+(inc-1500000)*0.3;
    }
    function calcTaxOld(inc){
      if(inc<=250000) return 0;
      if(inc<=500000) return (inc-250000)*0.05;
      if(inc<=1000000) return 12500+(inc-500000)*0.2;
      return 12500+100000+(inc-1000000)*0.3;
    }
    const taxAmt = taxRegime==="new"?calcTaxNew(taxableIncome):calcTaxOld(taxableIncome);
    const cess = Math.round(taxAmt*0.04);
    const totalTax = taxAmt+cess;
    return (
      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <Ico n="calc" s={16} c="#8B5CF6"/><p style={{margin:0,fontSize:13,fontWeight:700,color:"var(--text)"}}>Tax Calculator (India)</p>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:12,background:"var(--tab-bg)",borderRadius:10,padding:4}}>
          {[["new","New Regime"],["old","Old Regime"]].map(([k,l])=>(
            <button key={k} onClick={()=>setTaxRegime(k)} style={{flex:1,padding:"7px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:taxRegime===k?600:400,background:taxRegime===k?"var(--card-bg)":"transparent",color:taxRegime===k?"#8B5CF6":"var(--tab-inactive)",boxShadow:taxRegime===k?"0 1px 4px rgba(0,0,0,0.15)":undefined}}>{l}</button>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div><p style={{margin:"0 0 2px",fontSize:9,color:"var(--text-mut)",textTransform:"uppercase"}}>Gross Annual Income</p><p style={{margin:0,fontSize:16,fontWeight:700,color:"var(--text)"}}>{INR(annualIncome)}</p></div>
          <div><p style={{margin:"0 0 2px",fontSize:9,color:"var(--text-mut)",textTransform:"uppercase"}}>Taxable Income</p><p style={{margin:0,fontSize:16,fontWeight:700,color:"var(--text)"}}>{INR(taxableIncome)}</p></div>
        </div>
        {taxRegime==="old"&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
          <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>Section 80C (max ₹1.5L)</label><input type="number" value={ded80C} onChange={e=>setDed80C(Number(e.target.value))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
          <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>Section 80D (Health Insurance)</label><input type="number" value={ded80D} onChange={e=>setDed80D(Number(e.target.value))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
          <div><label style={{fontSize:9,fontWeight:700,color:"var(--text-mut)",display:"block",marginBottom:2}}>Other Deductions</label><input type="number" value={otherDed} onChange={e=>setOtherDed(Number(e.target.value))} style={{width:"100%",boxSizing:"border-box",padding:"6px 8px",borderRadius:6,border:"1.5px solid var(--input-border)",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/></div>
        </div>}
        <div style={{background:"var(--card-bg)",border:"1px solid var(--card-border)",borderRadius:12,padding:"12px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:11,color:"var(--text-sec)"}}>Income Tax</span><span style={{fontSize:14,fontWeight:700,color:"#EF4444"}}>{INR(taxAmt)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:11,color:"var(--text-sec)"}}>Health & Education Cess (4%)</span><span style={{fontSize:14,fontWeight:700,color:"#F59E0B"}}>{INR(cess)}</span></div>
          <div style={{borderTop:"1px solid var(--card-border)",margin:"6px 0",paddingTop:6,display:"flex",justifyContent:"space-between"}}><span style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>Total Tax Payable</span><span style={{fontSize:18,fontWeight:800,color:"#DC2626"}}>{INR(totalTax)}</span></div>
          <p style={{margin:"8px 0 0",fontSize:10,color:"var(--text-mut)"}}>Effective rate: {annualIncome>0?((totalTax/annualIncome)*100).toFixed(1):"0"}% of gross income</p>

      </Card>
    );

        {[["Date","date","date"],["Amount (₹)","number","amount"],["Note (optional)","text","note"]].map(([label,type,key])=>(

            <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} placeholder={key==="amount"?"0.00":key==="note"?"e.g. Swiggy, rent…":""} style={{width:"100%",boxSizing:"border-box",borderRadius:10,border:"1.5px solid var(--input-border)",padding:"9px 12px",fontSize:13,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
          </div>
        ))}
        <div style={{marginBottom:10}}>
          <label style={{fontSize:10,fontWeight:700,color:"#6B7280",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Tags (comma-separated)</label>
          <input type="text" value={form.tags} onChange={e=>setForm(f=>({...f,tags:e.target.value}))} placeholder="e.g. grocery, urgent" style={{width:"100%",boxSizing:"border-box",borderRadius:10,border:"1.5px solid var(--input-border)",padding:"9px 12px",fontSize:13,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}/>
        </div>
        {form.type !== "transfer" && (
        <div style={{marginBottom:14}}>

          <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} style={{width:"100%",boxSizing:"border-box",borderRadius:10,border:"1.5px solid var(--input-border)",padding:"9px 12px",fontSize:13,outline:"none",color:"var(--text)",background:"var(--input-bg)"}}>
            {(form.type==="income"?ic:ec).map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        )}
		{form.type !== "transfer" && (
<div style={{marginBottom:14}}>
  <label style={{fontSize:10,fontWeight:700,color:"#6B7280",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Payment Mode</label>

</div>
)}
{form.type === "transfer" && (

  const renderBatchModal = () => (
    <div style={{position:"fixed",inset:0,background:"rgba(15,10,40,0.72)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:"1rem"}}>
      <div style={{background:"var(--card-bg)",borderRadius:20,boxShadow:"0 24px 60px rgba(0,0,0,0.22)",padding:"1.5rem",width:400,maxWidth:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.1rem"}}>

            <div style={{width:36,height:36,borderRadius:10,background:"#EDE9FE",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="batch" s={17} c="#8B5CF6"/></div>
            <p style={{margin:0,fontWeight:700,fontSize:16,color:"var(--text)"}}>Batch add entries</p>
          </div>
          <CloseBtn onClick={()=>setShowBatch(false)}/>
        </div>
        <p style={{fontSize:11,color:"var(--text-sec)",margin:"0 0 8px",lineHeight:1.5}}>One per line: <code style={{background:"var(--card-border)",padding:"1px 5px",borderRadius:4,fontSize:10}}>Amount,Category,Note,Mode(Cash/Bank/UPI)</code></p>
        <textarea value={batchText} onChange={e=>setBatchText(e.target.value)} placeholder={"50,Uber,Office ride,Cash\n200,Zomato,Dinner,Bank/UPI\n5000,Salary,June salary,Bank/UPI"} rows={8} style={{width:"100%",boxSizing:"border-box",borderRadius:10,border:"1.5px solid var(--input-border)",padding:"9px 12px",fontSize:12,outline:"none",color:"var(--text)",background:"var(--input-bg)",resize:"vertical",fontFamily:"monospace"}}/>
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <button onClick={()=>setShowBatch(false)} style={{flex:1,fontSize:13,cursor:"pointer",borderRadius:10,padding:"10px",border:"1.5px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",fontWeight:600}}>Cancel</button>
          <button onClick={()=>{
            const lines = batchText.split("\n").map(l=>l.trim()).filter(Boolean);
            let added=0;
            const newEntries = [];
            let maxNId = state.nextId;
            for(const line of lines){
              const parts = line.split(",").map(p=>p.trim());
              if(parts.length<2) continue;
              const amt = parseFloat(parts[0]);
              if(isNaN(amt)||amt<=0) continue;
              const cat = parts[1];
              const note = parts[2]||"";
              const mode = parts[3]||"Bank/UPI";
              const validModes = MODES.map(m=>m.toLowerCase());
              const matchedMode = validModes.includes(mode.toLowerCase()) ? (mode.toLowerCase()==="cash"?"Cash":"Bank/UPI") : "Bank/UPI";
              const isInc = [...ic,...ec].includes(cat) ? (ic.includes(cat)?"income":"expense") : "expense";
              newEntries.push({date:new Date().toISOString().slice(0,10),type:isInc,amount:amt,category:cat,note:note,mode:matchedMode,tags:[],id:maxNId++});
              added++;
            }
            if(added===0){showToast("No valid entries found");return;}
            upd(s=>({entries:[...s.entries,...newEntries],nextId:maxNId}));
            setShowBatch(false);
            showToast(`${added} entries added`);
          }} style={{flex:2,fontSize:14,cursor:"pointer",background:"linear-gradient(135deg,#8B5CF6,#7C3AED)",color:"#fff",border:"none",borderRadius:10,padding:"10px",fontWeight:700}}>Add {batchText.split("\n").filter(l=>l.trim()).length} entries</button>

            {pastMonths.map(pm=>(
              <div key={pm.key} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"var(--card-bg)",borderRadius:12,border:"1px solid var(--card-border)"}}>
                <div style={{width:40,height:40,borderRadius:10,background:"var(--card-border)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:10,fontWeight:800,color:"#8B5CF6"}}>{MN[pm.m]}</span>
                </div>
                <div style={{flex:1}}>
                  <p style={{margin:"0 0 3px",fontSize:13,fontWeight:700,color:"var(--text)"}}>{FM[pm.m]} {pm.y}</p>
                  <p style={{margin:0,fontSize:11}}>
                    <span style={{color:"#10B981"}}>+{INR(pm.inc)}</span>
                    <span style={{margin:"0 5px",color:"#D1D5DB"}}>·</span>
                    <span style={{color:"#EF4444"}}>-{INR(pm.exp)}</span>
                    <span style={{margin:"0 5px",color:"#D1D5DB"}}>·</span>
                    <span style={{color:pm.net>=0?"#8B5CF6":"#EF4444",fontWeight:700}}>{pm.net>=0?"+":""}{INR(pm.net)}</span>
                  </p>
                </div>
                <button onClick={()=>{setViewM({y:pm.y,m:pm.m});setTab("tracker");setView("monthly");setShowHist(false);}} style={{fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:8,border:"1px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",fontWeight:600}}>View</button>
                <button onClick={async ()=>{const rows=[["Date","Type","Amount","Category","Note","Mode"],...pm.entries.map(e=>[e.date,e.type,e.amount,e.category,`"${e.note||""}"`,`"${e.mode||"Bank/UPI"}"`])]; await dl(rows.map(r=>r.join(",")).join("\n"),`FinTrack_${pm.key}.csv`,"text/csv;charset=utf-8");}} style={{fontSize:11,padding:"5px 8px",cursor:"pointer",borderRadius:8,border:"1px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text-sec)",display:"flex",alignItems:"center",gap:4}}> <Ico n="dl" s={12} c="#6B7280"/> CSV </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  const renderDataModal = () => (
    <div style={{position:"fixed",inset:0,background:"rgba(15,10,40,0.72)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:"1rem"}}>
      <div style={{background:"var(--card-bg)",borderRadius:20,boxShadow:"0 24px 60px rgba(0,0,0,0.22)",padding:"1.5rem",width:420,maxWidth:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.1rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:"#DBEAFE",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="dl" s={18} c="#3B82F6"/></div>
            <p style={{margin:0,fontWeight:700,fontSize:16,color:"var(--text)"}}>Data management</p>
          </div>
          <CloseBtn onClick={()=>setShowData(false)}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {[
            {ico:"dl",label:"Export all entries as CSV",sub:"Download spreadsheet",c:"#3B82F6",bg:"#EFF6FF",fn:exportCSV},
            {ico:"dl",label:"Export full backup (JSON)",sub:"Save all app data",c:"#8B5CF6",bg:"#EDE9FE",fn:exportJSON},
            {ico:"ul",label:"Import backup (JSON)",sub:"Select a FinTrack_Backup_*.json file from your device",c:"#10B981",bg:"#F0FDF4",fn:()=>fileRef.current?.click()},
            {ico:"reset",label:"Reset all data",sub:"Permanently delete everything",c:"#EF4444",bg:"#FEF2F2",fn:resetAll},
            {ico:"ul",label:"Copy periodic report to clipboard",sub:"Plain-text summary of this month",c:"#F97316",bg:"#FFF7ED",fn:()=>{
              const incTotal = entries.filter(e=>e.type==="income"&&e.date.slice(0,7)===curMk).reduce((a,b)=>a+b.amount,0);
              const expTotal = entries.filter(e=>e.type==="expense"&&e.date.slice(0,7)===curMk).reduce((a,b)=>a+b.amount,0);
              const topCat = [...catData].sort((a,b)=>b.value-a.value).slice(0,3).map(c=>`${c.name}: ${INR(c.value)}`).join(", ");
              const lines = [
                `📊 FinTrack Report — ${FM[viewM.m]} ${viewM.y}`,
                `──────────────────────────────`,
                `Income:      ${INR(incTotal)}`,
                `Expenses:    ${INR(expTotal)}`,
                `Savings:     ${INR(incTotal-expTotal)}`,
                `Top spends:  ${topCat||"None"}`,
                `Net Worth:   ${sINR(netWorthTotal)}`,
                `Health:      ${healthLevel.l} (${Math.round(healthScore)}/100)`,
                `──────────────────────────────`,
                `Generated by FinTrack`,
              ].join("\n");
              navigator.clipboard?.writeText(lines).then(()=>showToast("📋 Report copied to clipboard")).catch(()=>showToast("Copy failed — select text manually"));
            }},
          ].map(({ico,label,sub,c,bg,fn})=>(
            <button key={label} onClick={fn} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,background:bg,border:"none",cursor:"pointer",textAlign:"left",width:"100%"}}>
              <div style={{width:36,height:36,borderRadius:9,background:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ico n={ico} s={17} c={c}/></div>
              <div><p style={{margin:"0 0 1px",fontSize:13,fontWeight:600,color:"var(--text)"}}>{label}</p><p style={{margin:0,fontSize:11,color:"var(--text-sec)"}}>{sub}</p></div>
            </button>
          ))}
        </div>
        {/* Changed accept criteria to help Android systems pick up custom extension maps easily */}
<input ref={fileRef} type="file" accept=".json,application/json,*/*" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importJSON(e.target.files[0]);}}/>
      </div>
    </div>
  );

  // ── MAIN RENDER ───────────────────────────────────────────────────────────
  return (
    <div style={{fontFamily:"system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",maxWidth:720,margin:"0 auto",minHeight:"100vh",background:"var(--bg)",position:"relative"}}>

      {/* 🔐 PIN Lock overlay */}
      {locked && (
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"var(--bg)",zIndex:99999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"var(--card-bg)",borderRadius:20,boxShadow:"0 24px 60px rgba(0,0,0,0.22)",padding:"2rem",width:320,maxWidth:"100%",textAlign:"center",position:"relative"}}>
            {!savedPin && <button onClick={()=>{setLocked(false);setPinMode("unlock");setPinInput("");setPinConfirm("");setPinErr("");}} aria-label="Close" style={{position:"absolute",top:12,right:12,width:30,height:30,borderRadius:"50%",background:"var(--card-border)",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="x" s={14} c="var(--text-sec)"/></button>}
            <div style={{width:56,height:56,borderRadius:"50%",background:"#EDE9FE",margin:"0 auto 16px",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Ico n="lock" s={26} c="#8B5CF6"/>
            </div>
            <p style={{margin:"0 0 4px",fontSize:18,fontWeight:700,color:"var(--text)"}}>FinTrack</p>
            <p style={{margin:"0 0 16px",fontSize:13,color:"var(--text-sec)"}}>{pinMode==="set"?"Set your 4-digit PIN":"Enter your PIN"}</p>
            <input type="password" inputMode="numeric" maxLength={4} value={pinInput} onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(0,4);setPinInput(v);setPinErr("");}} placeholder="• • • •" style={{width:"100%",boxSizing:"border-box",textAlign:"center",fontSize:28,letterSpacing:8,padding:"10px",borderRadius:10,border:"1.5px solid var(--input-border)",outline:"none",background:"var(--input-bg)",color:"var(--text)",marginBottom:10}}/>
            {pinErr&&<p style={{margin:"0 0 8px",fontSize:12,color:"#EF4444"}}>{pinErr}</p>}
            {pinMode==="set" && (
              <>
                <input type="password" inputMode="numeric" maxLength={4} value={pinConfirm} onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(0,4);setPinConfirm(v);setPinErr("");}} placeholder="Confirm • • • •" style={{width:"100%",boxSizing:"border-box",textAlign:"center",fontSize:28,letterSpacing:8,padding:"10px",borderRadius:10,border:"1.5px solid var(--input-border)",outline:"none",background:"var(--input-bg)",color:"var(--text)",marginBottom:10}}/>
                <button onClick={()=>{
                  if(pinInput.length<4||pinInput!==pinConfirm){setPinErr("PINs must match and be 4 digits");return;}
                  setPin(pinInput);setLocked(false);setPinMode("unlock");setPinInput("");setPinConfirm("");showToast("PIN set successfully");
                }} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"#8B5CF6",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:6}}>Set PIN</button>
              </>
            )}
            {pinMode==="unlock" && (
              <>
                <button onClick={()=>{
                  if(pinInput.length<4){setPinErr("Enter 4-digit PIN");return;}
                  if(!checkPin(pinInput)){setPinErr("Wrong PIN");return;}
                  setLocked(false);setPinInput("");
                }} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"#8B5CF6",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:6}}>Unlock</button>
                <button onClick={()=>{
                  setConf({msg:"Forgot PIN? This will RESET ALL YOUR DATA and remove the PIN. This cannot be undone.",onConfirm:resetAllWithPin});
                }} style={{background:"none",border:"none",color:"var(--text-mut)",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>Forgot PIN? Reset data</button>
              </>
            )}
          </div>
        </div>
      )}

      {/* Gradient header */}
      <div style={{background:"var(--header-bg)",padding:"1.25rem 1.25rem 0.75rem",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"0.9rem"}}>
          <div>
		  <p style={{margin:"0 0 2px",fontSize:16,color:"rgba(255,255,255,0.9)",letterSpacing:"0.2em",textTransform:"uppercase"}}>Personal Finance Tracker</p>
            <p style={{margin:"0 0 2px",fontSize:12,color:"rgba(255,255,255,0.6)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Total balance</p>
            <p style={{margin:0,fontSize:30,fontWeight:700,color:runBal>=0?"#6EE7B7":"#FCA5A5",letterSpacing:"-0.5px"}}>{sINR(runBal)}</p>
          </div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={openAdd} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",cursor:"pointer",fontWeight:600}}><Ico n="plus" s={13} c="#fff"/> Add</button>
            <button onClick={()=>setShowHist(true)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="cal" s={13} c="#fff"/> History</button>
            <button onClick={()=>setShowData(true)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="dl" s={13} c="#fff"/> Data</button>
            <button onClick={()=>{if(undoStack.length===0)return;setConf({msg:"Undo the last action? This will revert to the previous state.",onConfirm:()=>{const[prev,...rest]=undoStack;setState(prev);saveData(prev);setUndoStack(rest);setConf(null);showToast("Undone");}});}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:undoStack.length>0?"#fff":"rgba(255,255,255,0.3)",border:`1px solid ${undoStack.length>0?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)"}`,cursor:undoStack.length>0?"pointer":"default",fontWeight:600}}><Ico n="reset" s={13} c={undoStack.length>0?"#fff":"rgba(255,255,255,0.3)"}/> Undo</button>
            <button onClick={()=>setHideAmt(d=>!d)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}>{hideAmt?<Ico n="eyeoff" s={14} c="#fff"/>:<Ico n="eye" s={14} c="#fff"/>}</button>
            <button onClick={()=>setDark(d=>!d)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}>{dark?"☀️":"🌙"}</button>
            {!savedPin && <button onClick={()=>{setPinMode("set");setPinInput("");setPinConfirm("");setPinErr("");setLocked(true);}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="lock" s={14} c="#fff"/> Set PIN</button>}
            {savedPin && <button onClick={()=>{setPinMode("unlock");setLocked(true);setPinInput("");setPinErr("");}} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="lock" s={14} c="#fff"/> Lock</button>}
          </div>
        </div>

        {/* Tab nav — scrollable, compact for mobile */}
        <div style={{display:"flex",gap:3,overflowX:"auto",paddingBottom:2,scrollbarWidth:"none",WebkitOverflowScrolling:"touch"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:"8px 8px 0 0",border:"none",cursor:"pointer",fontWeight:600,fontSize:11,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",background:tab===t.id?"var(--bg)":"transparent",color:tab===t.id?t.ac:"rgba(255,255,255,0.55)"}}>
              {tab===t.id&&<Ico n={t.ico} s={11} c={t.ac}/>}{t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Tab content */}
      <div style={{padding:"1.1rem",paddingBottom:"3rem"}}>
        {tab==="dashboard" && renderDashboard()}
        {tab==="tracker"   && renderTracker()}
        {tab==="analytics" && renderAnalytics()}
        {tab==="budget"    && renderBudget()}
        {tab==="goals"     && renderGoals()}
        {tab==="loans"     && renderLoans()}
        {tab==="networth"  && renderNetWorth()}
        {tab==="invest"    && renderInvest()}
        {tab==="taxcalc"   && renderTaxCalc()}
        {tab==="settings"  && renderSettings()}
      </div>

      {/* Modals */}
      {showForm && renderAddModal()}
      {showBatch && renderBatchModal()}
      {showHist && renderHistModal()}
      {showData && renderDataModal()}
	  {/* Custom Confirmation Popup */}
      {conf && (
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100000,padding:20}}>
          <div style={{background:"var(--card-bg)",borderRadius:16,padding:20,width:"100%",maxWidth:320,boxShadow:"0 10px 25px rgba(0,0,0,0.1)",textAlign:"center"}}>
            <h4 style={{margin:"0 0 10px 0",color:"var(--text)",fontSize:16,fontWeight:600}}>{conf.title||"Confirm"}</h4>
            <p style={{margin:"0 0 20px 0",color:"var(--text-sec)",fontSize:14,lineHeight:"20px"}}>{conf.msg}</p>
            <div style={{display:"flex",gap:12}}>
              <button onClick={() => setConf(null)} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid var(--card-border)",background:"var(--card-bg)",color:"var(--text)",fontWeight:500,cursor:"pointer",fontSize:14}}>Cancel</button>
              <button onClick={conf.onConfirm} style={{flex:1,padding:"10px",borderRadius:10,border:"none",background:"#EF4444",color:"#fff",fontWeight:500,cursor:"pointer",fontSize:14}}>Confirm</button>
            </div>
          </div>
        </div>
      )}

      {/* Toast notification */}
      {toast && (
        <div style={{position:"fixed",bottom:80,left:16,right:16,zIndex:99999,display:"flex",justifyContent:"center",pointerEvents:"none"}}>
          <div style={{background:dark?"#1e293b":"#1e1b4b",color:"#fff",padding:"12px 20px",borderRadius:12,fontSize:13,fontWeight:500,boxShadow:"0 8px 30px rgba(0,0,0,0.2)",textAlign:"center",maxWidth:"90%",border:"1px solid rgba(255,255,255,0.1)"}}>
            {toast}
          </div>
        </div>
      )}

      {/* Footer */}
      <div style={{textAlign:"center",padding:"1rem 0 1.5rem",borderTop:"1px solid var(--card-border)",marginTop:"1rem"}}>
        <p style={{margin:0,fontSize:11,color:"var(--text-mut)",letterSpacing:"0.06em"}}>Created by <span style={{ fontWeight: 600, color: "#A5B4FC", "textDecoration": "none" }}>
  <a href="https://pratik-acharya.netlify.app/" target="_blank" style={{ color: "inherit", textDecoration: "inherit" }}>PA</a>
</span>
</p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
