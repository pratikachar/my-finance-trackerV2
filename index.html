<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  <style>
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Stops layout shifts from creating false positives */
      background: #F8FAFC;
    }
    img, canvas, svg {
      pointer-events: none;
      user-drag: none;
      -webkit-user-drag: none;
    }
    #protected-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="protected-iframe"></iframe>

  <script>
    // ==================== CONFIGURATION & DOMAIN LOCK ====================
    const allowedDomains = ['ownfintrack.netlify.app', 'www.ownfintrack.netlify.app', 'localhost'];

    // ==================== NON-DESTRUCTIVE PROTECTION OVERLAY ====================
    const overlay = document.createElement('div');
    overlay.id = 'protection-overlay';
    overlay.innerHTML = `
      <div style="text-align:center; margin-top:20%; font-family:Arial, sans-serif; color:#dc2626;"> 
        <h1>🚫 Access Denied</h1> 
        <p id="overlay-reason">Unauthorized access detected</p> 
        <p>This application is protected.</p> 
        <a href="https://ownfintrack.netlify.app/" style="color:#2563eb; text-decoration:none; font-weight:600;">→ Go to Official Site</a> 
      </div>`;
    overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:#111827; z-index:999999; display:none;';
    document.body.appendChild(overlay);

    function toggleOverlay(show, reason = "") {
      if (show) {
        if (reason) document.getElementById('overlay-reason').innerText = reason;
        overlay.style.display = 'block';
      } else {
        overlay.style.display = 'none';
      }
    }

    function checkDomain() {
      if (!allowedDomains.includes(window.location.hostname)) {
        toggleOverlay(true, "Domain mismatch - Access Denied");
        return false;
      }
      return true;
    }

    function loadContent() {
      if (!checkDomain()) return;
      try {
        // Fallback placeholder safely handled directly within the document tree
        const appSource = `
          <!DOCTYPE html>
          <html>
          <head>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>
            <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"><\/script>
          </head>
          <body>
            <div id="root"></div>
            <script type="text/babel">
              // Your React code runs completely safe inside this container environment
            <\/script>
          </body>
          </html>`;

        const iframe = document.getElementById('protected-iframe');
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write(appSource);
        iframe.contentWindow.document.close();
        
        // Pass protections deep inside the iframe context
        applyUIBlocks(iframe.contentWindow.document);
      } catch(e) {
        toggleOverlay(true, "Application Initialization Failed");
      }
    }

    function applyUIBlocks(targetDoc) {
      // LAYER 1: Comprehensive UI Event Blocks
      targetDoc.addEventListener('contextmenu', e => e.preventDefault());
      
      targetDoc.addEventListener('keydown', e => {
        const blocked = ['F12', 'u', 's', 'i', 'c', 'a', 'p'];
        if (e.ctrlKey && blocked.includes(e.key.toLowerCase())) e.preventDefault();
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey)) e.preventDefault();
      });

      ['selectstart', 'copy', 'cut', 'dragstart'].forEach(ev => {
        targetDoc.addEventListener(ev, e => e.preventDefault());
      });
    }

    // ==================== MULTI-LAYER PROTECTION SETUP ====================
    function activateMultiLayerProtection() {
      if (!checkDomain()) return;

      applyUIBlocks(document);

      // LAYER 2: DevTools Size Monitoring Toggles (No page destruction)
      setInterval(() => {
        if (!checkDomain()) return;

        const threshold = 160;
        const widthDiff = window.outerWidth - window.innerWidth;
        const heightDiff = window.outerHeight - window.innerHeight;

        if (widthDiff > threshold || heightDiff > threshold) {
          toggleOverlay(true, "Developer tools detected");
        } else {
          toggleOverlay(false); // Seamlessly drops the black overlay window when DevTools is closed
        }
      }, 350);

      // LAYER 3 & CONSOLE: Active Spam Clears
      console.clear();
      console.log("%c🔐 OwnFinTrack Protected v2.5 - Multiple Encryption Layers Active", "color:#7c3aed;font-size:14px;font-weight:bold");
    }

    window.addEventListener('load', () => {
      loadContent();
      activateMultiLayerProtection();
    });
  </script>
</body>
</html>
