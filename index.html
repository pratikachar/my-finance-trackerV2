// Grouped vertical bar chart for income vs expenses
const BarChartSVG = ({data, height=200}) => {
  const W=560, H=height, PL=48, PR=8, PT=10, PB=24;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allVals=data.flatMap(d=>[d.inc||0,d.exp||0]);
  const maxV=Math.max(...allVals,1);
  const groupW=cW/data.length;
  const bW=Math.min(groupW*0.35,22);
  const fmt=v=>v>=1000?(v/1000).toFixed(0)+"K":v;
  const ticks=4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:height,display:"block"}}>
      {/* Y gridlines */}
      {Array.from({length:ticks+1},(_,i)=>{
        const y=PT+cH*(1-i/ticks);
        return <g key={i}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="#F3F4F6" strokeWidth="1"/>
          <text x={PL-4} y={y+4} fontSize="9" fill="#9CA3AF" textAnchor="end">{fmt(maxV*i/ticks)}</text>
        </g>;
      })}
      {/* Bars */}
      {data.map((d,i)=>{
        const cx=PL+groupW*(i+0.5);
        const incH=(d.inc/maxV)*cH;
        const expH=(d.exp/maxV)*cH;
        return <g key={i}>
          <rect x={cx-bW-1} y={PT+cH-incH} width={bW} height={Math.max(incH,1)} fill="#10B981" rx="3"/>
          <rect x={cx+1}    y={PT+cH-expH} width={bW} height={Math.max(expH,1)} fill="#EF4444" rx="3"/>
          <text x={cx} y={H-4} fontSize="10" fill="#9CA3AF" textAnchor="middle">{d.month}</text>
        </g>;
      })}
    </svg>
  );
};

// Horizontal bar chart for category spending
const HBarChartSVG = ({data}) => {
  if(!data||data.length===0) return null;
  const rowH=36, PL=72, PR=60, PT=4;
  const H=data.length*rowH+PT*2;
  const W=400;
  const maxV=Math.max(...data.map(d=>d.value),1);
  const fmt=v=>v>=1000?(v/1000).toFixed(1)+"K":v;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,display:"block"}}>
      {data.map((d,i)=>{
        const y=PT+i*rowH;
        const bW=Math.max(((d.value/maxV)*(W-PL-PR)),2);
        const color=CC[d.name]||"#9CA3AF";
        return <g key={d.name}>
          <text x={PL-6} y={y+rowH/2+4} fontSize="11" fill="#374151" textAnchor="end">{d.name}</text>
          <rect x={PL} y={y+6} width={bW} height={rowH-14} fill={color} rx="4"/>
          <text x={PL+bW+5} y={y+rowH/2+4} fontSize="10" fill="#6B7280">{fmt(d.value)}</text>
        </g>;
      })}
    </svg>
  );
};

// Line chart for savings trend
const LineChartSVG = ({data, height=150}) => {
  const W=560, H=height, PL=44, PR=8, PT=10, PB=22;
  const cW=W-PL-PR, cH=H-PT-PB;
  const vals=data.map(d=>d.savings);
  const minV=Math.min(...vals,0);
  const maxV=Math.max(...vals,1);
  const range=maxV-minV||1;
  const fmt=v=>v>=1000?(v/1000).toFixed(0)+"K":v<0?"-"+((-v/1000).toFixed(0))+"K":v;
  const px=(i)=>PL+cW*(i/(data.length-1||1));
  const py=(v)=>PT+cH*(1-(v-minV)/range);
  const pts=data.map((d,i)=>`${px(i)},${py(d.savings)}`).join(" ");
  const apts=`${PL},${PT+cH} ${data.map((d,i)=>`${px(i)},${py(d.savings)}`).join(" ")} ${PL+cW},${PT+cH}`;
  const ticks=3;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:height,display:"block"}}>
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#8B5CF6" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#8B5CF6" stopOpacity="0.01"/>
        </linearGradient>
      </defs>
      {Array.from({length:ticks+1},(_,i)=>{
        const v=minV+range*(i/ticks);
        const y=PT+cH*(1-i/ticks);
        return <g key={i}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="#F3F4F6" strokeWidth="1"/>
          <text x={PL-4} y={y+4} fontSize="9" fill="#9CA3AF" textAnchor="end">{fmt(v)}</text>
        </g>;
      })}
      {data.length>1 && <polygon points={apts} fill="url(#lineGrad)"/>}
      {data.length>1 && <polyline points={pts} fill="none" stroke="#8B5CF6" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {data.map((d,i)=>(
        <g key={i}>
          <circle cx={px(i)} cy={py(d.savings)} r="4" fill="#8B5CF6"/>
          <text x={px(i)} y={H-4} fontSize="10" fill="#9CA3AF" textAnchor="middle">{d.month}</text>
        </g>
      ))}
    </svg>
  );
};

// Donut / Pie chart for category breakdown
const DonutChartSVG = ({data, size=160}) => {
  const cx=size/2, cy=size/2, R=size*0.44, r=size*0.25;
  let total=data.reduce((a,d)=>a+d.value,0)||1;
  let angle=-Math.PI/2;
  const slices=data.map(d=>{
    const sweep=(d.value/total)*2*Math.PI;
    const x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    angle+=sweep;
    const x2=cx+R*Math.cos(angle), y2=cy+R*Math.sin(angle);
    const ix1=cx+r*Math.cos(angle-sweep), iy1=cy+r*Math.sin(angle-sweep);
    const ix2=cx+r*Math.cos(angle), iy2=cy+r*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    const path=`M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${ix2} ${iy2} A${r} ${r} 0 ${large} 0 ${ix1} ${iy1} Z`;
    return {path, color:CC[d.name]||"#9CA3AF"};
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="#fff" strokeWidth="1.5"/>)}
    </svg>
  );
};

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.1rem"}}>

            <div style={{width:36,height:36,borderRadius:10,background:"#EDE9FE",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="cal" s={18} c="#8B5CF6"/></div>
            <p style={{margin:0,fontWeight:700,fontSize:16,color:"#1e1b4b"}}>Past months</p>
          </div>
          <CloseBtn onClick={()=>setShowHist(false)}/>
        </div>
        {pastMonths.length===0?(
          <div style={{textAlign:"center",padding:"2.5rem 1rem"}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"#F3F4F6",margin:"0 auto 1rem",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Ico n="cal" s={28} c="#D1D5DB"/>
            </div>
            <p style={{margin:"0 0 6px",fontWeight:600,fontSize:15,color:"#374151"}}>No past data found</p>
            <p style={{margin:"0 0 1.5rem",fontSize:13,color:"#6B7280",lineHeight:1.6}}>Add entries to start building your financial history.</p>
            <button onClick={()=>setShowHist(false)} style={{background:"#8B5CF6",color:"#fff",border:"none",borderRadius:10,padding:"10px 28px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Got it</button>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {pastMonths.map(pm=>(
              <div key={pm.key} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"#F9FAFB",borderRadius:12}}>
                <div style={{width:40,height:40,borderRadius:10,background:"#EDE9FE",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontSize:10,fontWeight:800,color:"#8B5CF6"}}>{MN[pm.m]}</span>
                </div>
                <div style={{flex:1}}>
                  <p style={{margin:"0 0 3px",fontSize:13,fontWeight:700,color:"#111827"}}>{FM[pm.m]} {pm.y}</p>
                  <p style={{margin:0,fontSize:11}}>
                    <span style={{color:"#10B981"}}>+{INR(pm.inc)}</span>
                    <span style={{margin:"0 5px",color:"#D1D5DB"}}>·</span>
                    <span style={{color:"#EF4444"}}>-{INR(pm.exp)}</span>
                    <span style={{margin:"0 5px",color:"#D1D5DB"}}>·</span>
                    <span style={{color:pm.net>=0?"#8B5CF6":"#EF4444",fontWeight:700}}>{pm.net>=0?"+":""}{INR(pm.net)}</span>
                  </p>
                </div>
                <button onClick={()=>{setViewM({y:pm.y,m:pm.m});setTab("tracker");setView("monthly");setShowHist(false);}} style={{fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:8,border:"1px solid #E5E7EB",background:"#fff",color:"#374151",fontWeight:600}}>View</button>
                <button onClick={()=>{const rows=[["Date","Type","Amount","Category","Note"],...pm.entries.map(e=>[e.date,e.type,e.amount,e.category,`"${e.note||""}"`])];dl("data:text/csv;charset=utf-8,"+encodeURIComponent(rows.map(r=>r.join(",")).join("\n")),`transactions_${pm.key}.csv`);}} style={{fontSize:11,padding:"5px 8px",cursor:"pointer",borderRadius:8,border:"1px solid #E5E7EB",background:"#fff",display:"flex",alignItems:"center",gap:4}}>
                  <Ico n="dl" s={12} c="#6B7280"/> CSV
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  const renderDataModal = () => (
    <div style={{position:"fixed",inset:0,background:"rgba(15,10,40,0.72)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:"1rem"}}>
      <div style={{background:"#fff",borderRadius:20,boxShadow:"0 24px 60px rgba(0,0,0,0.22)",padding:"1.5rem",width:420,maxWidth:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.1rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:"#DBEAFE",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="dl" s={18} c="#3B82F6"/></div>
            <p style={{margin:0,fontWeight:700,fontSize:16,color:"#1e1b4b"}}>Data management</p>
          </div>
          <CloseBtn onClick={()=>setShowData(false)}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {[
            {ico:"dl",label:"Export all entries as CSV",sub:"Download spreadsheet",c:"#3B82F6",bg:"#EFF6FF",fn:exportCSV},
            {ico:"dl",label:"Export full backup (JSON)",sub:"Save all app data",c:"#8B5CF6",bg:"#EDE9FE",fn:exportJSON},
            {ico:"ul",label:"Import backup (JSON)",sub:"Restore from backup file",c:"#10B981",bg:"#F0FDF4",fn:()=>fileRef.current?.click()},
            {ico:"reset",label:"Reset all data",sub:"Permanently delete everything",c:"#EF4444",bg:"#FEF2F2",fn:resetAll},
          ].map(({ico,label,sub,c,bg,fn})=>(
            <button key={label} onClick={fn} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,background:bg,border:"none",cursor:"pointer",textAlign:"left",width:"100%"}}>
              <div style={{width:36,height:36,borderRadius:9,background:"rgba(255,255,255,0.7)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ico n={ico} s={17} c={c}/></div>
              <div><p style={{margin:"0 0 1px",fontSize:13,fontWeight:600,color:"#1F2937"}}>{label}</p><p style={{margin:0,fontSize:11,color:"#6B7280"}}>{sub}</p></div>
            </button>
          ))}
        </div>
        <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importJSON(e.target.files[0]);}}/>
      </div>
    </div>
  );

  // ── MAIN RENDER ───────────────────────────────────────────────────────────
  return (
    <div style={{fontFamily:"system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",maxWidth:720,margin:"0 auto",minHeight:"100vh",background:"#F8FAFC"}}>

      {/* Gradient header */}
      <div style={{background:"linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%)",padding:"1.25rem 1.25rem 0.75rem",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"0.9rem"}}>
          <div>
		  <p style={{margin:"0 0 2px",fontSize:16,color:"rgba(255,255,255,0.9)",letterSpacing:"0.2em",textTransform:"uppercase"}}>Personal Finance Tracker</p>
            <p style={{margin:"0 0 2px",fontSize:12,color:"rgba(255,255,255,0.6)",letterSpacing:"0.1em",textTransform:"uppercase"}}>Total balance</p>
            <p style={{margin:0,fontSize:30,fontWeight:700,color:runBal>=0?"#6EE7B7":"#FCA5A5",letterSpacing:"-0.5px"}}>{runBal<0?"-":""}{INR(runBal)}</p>
          </div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={openAdd} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.2)",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",cursor:"pointer",fontWeight:600}}><Ico n="plus" s={13} c="#fff"/> Add</button>
            <button onClick={()=>setShowHist(true)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="cal" s={13} c="#fff"/> History</button>
            <button onClick={()=>setShowData(true)} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,padding:"7px 14px",borderRadius:8,background:"rgba(255,255,255,0.12)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",fontWeight:600}}><Ico n="dl" s={13} c="#fff"/> Data</button>
          </div>
        </div>

        {/* Tab nav */}
        <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2,scrollbarWidth:"none"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 14px",borderRadius:"8px 8px 0 0",border:"none",cursor:"pointer",fontWeight:600,fontSize:12,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",background:tab===t.id?"#F8FAFC":"transparent",color:tab===t.id?t.ac:"rgba(255,255,255,0.55)"}}>
              <Ico n={t.ico} s={13} c={tab===t.id?t.ac:"rgba(255,255,255,0.55)"}/>{t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Tab content */}
      <div style={{padding:"1.1rem",paddingBottom:"3rem"}}>
        {tab==="dashboard" && renderDashboard()}
        {tab==="tracker"   && renderTracker()}
        {tab==="analytics" && renderAnalytics()}
        {tab==="budget"    && renderBudget()}
        {tab==="goals"     && renderGoals()}
        {tab==="invest"    && renderInvest()}
      </div>

      {/* Modals */}
      {showForm && renderAddModal()}
      {showHist && renderHistModal()}
      {showData && renderDataModal()}

      {/* Footer */}
      <div style={{textAlign:"center",padding:"1rem 0 1.5rem",borderTop:"1px solid #E5E7EB",marginTop:"1rem"}}>
        <p style={{margin:0,fontSize:11,color:"#CBD5E1",letterSpacing:"0.06em"}}>Created by <span style={{fontWeight:600,color:"#A5B4FC"}}>PA</span></p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

    <script>
        const allowedDomains = ['ownfintrack.netlify.app', 'www.ownfintrack.netlify.app', 'localhost'];

        let devToolsOpened = false;

        function detectDevTools() {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;

            if (widthDiff > threshold || heightDiff > threshold) {
                devToolsOpened = true;
                destroyPage();
            }
        }

        function destroyPage() {
            document.body.innerHTML = `
                <div style="text-align:center; margin-top:15%; font-family:Arial; color:#ff0000;">
                    <h1>Access Denied</h1>
                    <p>Developer tools detected. This content is protected.</p>
                    <p><a href="https://ownfintrack.netlify.app/" style="color:#0066ff;">Return to Official Site</a></p>
                </div>`;
            document.body.style.background = "#000";
        }

        function protectWebsite() {
            const currentDomain = window.location.hostname;

            if (!allowedDomains.includes(currentDomain)) {
                destroyPage();
                return;
            }

            // Disable Right Click
            document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });

            // Disable Keyboard Shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'c' || e.key === 'a' || e.key === 'p')) {
                    e.preventDefault();
                    return false;
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))) {
                    e.preventDefault();
                    return false;
                }
            });

            // Disable Copy, Select, Drag
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());

            // DevTools Detection
            setInterval(detectDevTools, 300);

            // Fake Source Protection (makes source look scrambled)
            console.clear();
            console.log("%c🚫 This website is protected. Unauthorized copying is not allowed.", "color: red; font-size: 16px; font-weight: bold;");

            // Override toString to confuse scrapers
            Function.prototype.toString = function() {
                return "function() { [protected code] }";
            };
        }

        // Initialize protection
        window.addEventListener('load', protectWebsite);

        // Extra layer: Prevent console access
        Object.defineProperty(console, '_commandLineAPI', { get: function() { destroyPage(); } });
    </script>
