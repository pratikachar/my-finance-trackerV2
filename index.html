<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <style>
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #F8FAFC;
        }
    </style>
</head>
<body>
    <div id="protected-content" style="min-height:100vh"></div>

    <script>
        // Multi-layer protection
        const allowedDomains = ['ownfintrack.netlify.app', 'www.ownfintrack.netlify.app', 'localhost'];

        // Layer 3: Heavily encoded content (Base64 of Base64)
        const layer3 = "PCFET0NUWVBFIGh0bWw+...[FULL ENCODED CONTENT HERE - TRUNCATED FOR BREVITY]...";

        function decodeLayer3(str) {
            return decodeURIComponent(atob(str));
        }

        function destroyPage(reason = "Unauthorized access detected") {
            document.body.innerHTML = `
                <div style="text-align:center;margin-top:20%;font-family:Arial,sans-serif;color:#dc2626;">
                    <h1>🚫 Access Denied</h1>
                    <p>${reason}</p>
                    <p>This app only works on the official domain.</p>
                    <a href="https://ownfintrack.netlify.app/" style="color:#2563eb;text-decoration:none;font-weight:600;">→ Go to Official Site</a>
                </div>`;
            document.body.style.background = "#111827";
        }

        function checkDomain() {
            if (!allowedDomains.includes(window.location.hostname)) {
                destroyPage("Domain mismatch");
                return false;
            }
            return true;
        }

        function loadContent() {
            if (!checkDomain()) return;

            try {
                // Decode Layer 3
                let html = decodeLayer3(layer3);
                document.getElementById('protected-content').innerHTML = html;
            } catch(e) {
                destroyPage("Decryption failed");
            }
        }

        function activateMultiLayerProtection() {
            // Layer 1: Basic blocks
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                const blocked = ['F12', 'u', 's', 'i', 'c', 'a', 'p'];
                if (e.ctrlKey && blocked.includes(e.key.toLowerCase())) e.preventDefault();
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey)) e.preventDefault();
            });
            ['selectstart','copy','cut','dragstart'].forEach(ev => 
                document.addEventListener(ev, e => e.preventDefault())
            );

            // Layer 2: DevTools detection (multiple methods)
            let devToolsCounter = 0;
            const devCheck = setInterval(() => {
                if (window.outerWidth - window.innerWidth > 120 || window.outerHeight - window.innerHeight > 120) {
                    devToolsCounter++;
                    if (devToolsCounter > 3) {
                        clearInterval(devCheck);
                        destroyPage("Developer tools detected");
                    }
                }
            }, 350);

            // Console spam protection
            console.clear();
            console.log("%c🔐 OwnFinTrack Protected v2.0 - Multiple Encryption Layers Active", "color:#7c3aed;font-size:14px;font-weight:bold");
        }

        // Final Init
        window.addEventListener('load', () => {
            loadContent();
            activateMultiLayerProtection();
        });
    </script>
</body>
</html>
