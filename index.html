        function decodeBase64(str) {
            return decodeURIComponent(atob(str));
        }

        function destroyPage() {
            document.body.innerHTML = `
                <div style="text-align:center; margin-top:15%; color:#ff0000; font-family:Arial;">
                    <h1>Access Denied</h1>
                    <p>This content is protected and can only be viewed on the official website.</p>
                    <a href="https://ownfintrack.netlify.app/" style="color:#0066ff;">Go to Official Site</a>
                </div>`;
            document.body.style.background = "#000";
        }

        function checkDomain() {
            const current = window.location.hostname;
            if (!allowedDomains.includes(current)) {
                destroyPage();
                return false;
            }
            return true;
        }

        function loadProtectedContent() {
            if (!checkDomain()) return;

            try {
                const decodedHTML = decodeBase64(encodedContent);
                document.getElementById('content').innerHTML = decodedHTML;
            } catch (e) {
                destroyPage();
            }
        }

        // ==================== ANTI-TAMPERING ====================
        function protect() {
            // Right Click
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Keyboard
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && ['u','s','i','c','a','p'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key))) {
                    e.preventDefault();
                }
            });

            // Selection & Copy
            document.addEventListener('selectstart', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());

            // DevTools Detection
            setInterval(() => {
                if (window.outerWidth - window.innerWidth > 150 || window.outerHeight - window.innerHeight > 150) {
                    destroyPage();
                }
            }, 500);

            console.clear();
            console.log("%c🚫 OwnFinTrack - Protected Content", "color:red; font-size:18px; font-weight:bold;");
        }

        // Initialize
        window.addEventListener('load', () => {
            loadProtectedContent();
            protect();
        });
    </script>
